# Supabase project configuration for Job Hunter Pages (see supabase/README.md and docs/CONTRACT.md).
# `npx supabase config push` applies the [auth] / [api] / [storage] sections to the linked hosted project.
project_id = "job-hunter-pages"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

# The 10 MiB cap mirrors the contract (documents are PDF/DOCX only, max 10 MB). The `documents` bucket is created by
# supabase/migrations/20261020100300_storage.sql, together with its own limit and mime-type allow-list.
[storage]
enabled = true
file_size_limit = "10MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
# Production Pages URL (trailing slash on purpose: the email templates append "?token_hash=...").
site_url = "https://quan240594.github.io/job-hunter-pages/"
# HashRouter + PKCE: tokens arrive as ?code=/?token_hash= in the query string, never in the hash (docs/DESIGN.md).
additional_redirect_urls = [
  "https://quan240594.github.io/job-hunter-pages/",
  "http://localhost:5173/job-hunter-pages/",
  "http://127.0.0.1:5173/job-hunter-pages/",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Invite-only: there is no public registration. The admin-users Edge Function creates every account.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
# Documented policy: at least 12 characters with lower case, upper case and digits. The admin-users function applies
# the same length check to temporary passwords.
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

[auth.email]
# This enables the email+password PROVIDER (logins); in Supabase's config mapping it is NOT "allow new signups".
# Public registration stays disabled by the top-level [auth] enable_signup = false (invite-only). Setting this to
# false would make every email login fail with 422 email_provider_disabled.
# Confirmations only matter for address changes: users must prove the new address.
# Admin-created users are confirmed by the Edge Function (email_confirm: true) or by accepting the invite.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

# Custom email templates (supabase/templates/*.html) are NOT configured here: the free tier with the default email
# provider rejects `config push` when any [auth.email.template.*] block is present. Enable them only after custom SMTP
# is set up - see "Optional: custom SMTP and email templates" in supabase/README.md for the exact blocks.

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 10

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# The platform verifies the caller's JWT before the function runs; the function re-checks the admin role itself.
[functions.admin-users]
enabled = true
verify_jwt = true
