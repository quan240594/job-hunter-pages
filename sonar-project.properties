# For a local scan, run scripts/sonar-scan.sh (reads the token from the gitignored .env.sonar.local - see that
# script's header for one-time setup). This repo and its Sonar project are public, so the analysis does not use the
# private-project lines-of-code quota.
sonar.organization=quan240594
sonar.projectKey=quan240594_job-hunter-pages
sonar.projectName=Job Hunter Pages

sonar.sources=src,scripts,supabase/functions,supabase/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,src/test-setup.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.npm-cache/**,**/.tmp/**,**/.vite/**

# Thin wiring-only entry points, type declarations and test helpers carry no testable logic.
# Must stay in sync with coverage.exclude in vite.config.ts. The interface-only files types.ts/dataApi.ts report no
# executable lines.
sonar.coverage.exclusions=src/test-setup.ts,src/main.tsx,src/vite-env.d.ts,**/__fixtures__/**,scripts/*.ts,scripts/admin/*.ts,supabase/functions/**/index.ts,supabase/tests/**

# ISODateTime is a documentary alias of the shared contract (mirrored in eslint.config.js).
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.e1.resourceKey=src/api/types.ts

# Sequential/paginated I/O or ordered cleanup (storage objects before rows, page after page) is intentional: awaits in
# these loops must not run in parallel.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.e2.resourceKey=scripts/lib/cleanup.ts
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.e3.resourceKey=supabase/functions/admin-users/handler.ts
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.e4.resourceKey=supabase/tests/db.ts
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.e5.resourceKey=scripts/lib/userAdmin.ts

sonar.sourceEncoding=UTF-8

# Produced by `npm run test:coverage`; vitest writes SF: paths relative to the repo root, which is what Sonar expects.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.typescript.tsconfigPaths=tsconfig.json
